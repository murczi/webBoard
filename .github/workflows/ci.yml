name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_PASSWORD: webboard-ci-only
          POSTGRES_DB: webboard_browser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WEBBOARD_TEST_DATABASE: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=webboard-ci-only
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Webboard.slnx
      - run: dotnet build Webboard.slnx --configuration Release --no-restore
      - run: dotnet test Webboard.slnx --configuration Release --no-build
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tests/js/*.test.cjs
      - run: python3 -m unittest discover -s deploy/tests -v
      - run: npm ci --prefix tests/browser
      - run: npx --prefix tests/browser playwright install --with-deps chromium
      - run: dotnet publish src/Webboard.Web -c Release --no-restore -o "$RUNNER_TEMP/webboard-browser"
      - name: Browser functionality through HTTPS proxy
        env:
          WEBBOARD_BROWSER_DATABASE: Host=localhost;Port=5432;Database=webboard_browser;Username=postgres;Password=webboard-ci-only
        run: WEBBOARD_BROWSER_APP="$RUNNER_TEMP/webboard-browser/Webboard.Web.dll" npm test --prefix tests/browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: tests/browser/test-results

  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        component: [ui, agent]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/${{ matrix.component }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
