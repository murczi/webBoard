name: Publish Docker images

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-docker-images
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set shared image version
        id: version
        run: echo "value=1.$((GITHUB_RUN_NUMBER - 1))" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # Build both images successfully before publishing either one.
      - name: Build UI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/ui/Dockerfile
          load: true
          tags: shujidev/webboard:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

      - name: Build agent image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/agent/Dockerfile
          load: true
          tags: shujidev/webboard-agent:${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: shujidev
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push both images
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          docker push "shujidev/webboard:$IMAGE_VERSION"
          docker push "shujidev/webboard-agent:$IMAGE_VERSION"
          {
            echo 'Published images:'
            echo "- shujidev/webboard:$IMAGE_VERSION"
            echo "- shujidev/webboard-agent:$IMAGE_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update latest tags for the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo 'Skipping latest: this commit is no longer the head of main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker tag "shujidev/webboard:$IMAGE_VERSION" shujidev/webboard:latest
          docker tag "shujidev/webboard-agent:$IMAGE_VERSION" shujidev/webboard-agent:latest
          docker push shujidev/webboard:latest
          docker push shujidev/webboard-agent:latest
          echo "Updated both latest tags to $IMAGE_VERSION." >> "$GITHUB_STEP_SUMMARY"
